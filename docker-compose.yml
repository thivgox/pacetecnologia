services:
  mysql:
    image: mysql:8.0
    container_name: pace-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pace_website
      MYSQL_USER: app
      MYSQL_PASSWORD: app

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/database_setup.sql:ro

volumes:
  mysql_data: